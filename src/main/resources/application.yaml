server:
  port: 8081

spring:
  application:
    name: spring_ai_demo

  ai:
#config for persistent chat memory, creates a 'spring_ai_chat_memory' table in the DB by default if not exists.
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

#Enable OpenAI embedding model.
    model:
      embedding: openai

    openai:
#open AI config
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_MODEL}
#        max-tokens: 25
#        max-completion-tokens: 30


#Embed model to use
      embedding:
        model: ${OPENAI_EMBEDD_MODEL}
        metadata-mode: embed



#GROQ AI config(uses OpenAI dependency)
#      api-key: ${GROQ_API_KEY}
#      base-url: ${GROQ_BASE_URL}
#      chat:
#        model: ${GROQ_MODEL}

#Google AI Config
#    google:
#      genai:
##        api-key: ${GOOGLE_API_KEY}
#        chat:
#          model: ${GOOGLE_AI_MODEL}

#h2-database config for persistent chat memory
#  datasource:
#    url: jdbc:h2:file:./data/db/chatmemory;AUTO_SERVER=TRUE #stores the data in a file, and reads it when server restarts.
#    driver-class-name: org.h2.Driver
#    username: root
#    password:
#
#  h2:
#    console:
#      enabled: true

#PostgreSQL config for persistent chat memory
  datasource:
    url: jdbc:postgresql://localhost:5445/springai
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

#enabling logging for Spring AI
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
